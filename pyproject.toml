[project]
name = "fund-analyzer"
version = "0.1.0"
description = ""
authors = [
    {name = "runforsky",email = "runforsky@163.com"}
]
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy (>=2.0.48,<3.0.0)",
    "psycopg2-binary (>=2.9.11,<3.0.0)",
    "akshare (>=1.18.40,<2.0.0)",
    "pandas (>=2.0.0,<3.0.0)",
    "numpy (>=1.26.0,<3.0.0)",
    "typer (>=0.24.1,<0.25.0)",
    "pyyaml (>=6.0.3,<7.0.0)",
    "matplotlib (>=3.10.8,<4.0.0)",
    "plotly (>=6.6.0,<7.0.0)",
    "rich (>=14.3.3,<15.0.0)",
    "streamlit (==1.44.1)",
    "requests (>=2.31.0,<3.0.0)",
    "fastapi (>=0.115.0,<1.0.0)",
    "uvicorn[standard] (>=0.34.0,<1.0.0)",
    "sse-starlette (>=2.0.0,<3.0.0)",
    "pydantic (>=2.0.0,<3.0.0)",
]


[project.scripts]
fund-cli = "fund_analyzer.cli.app:app"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{include = "fund_analyzer", from = "src"}]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest (>=9.0.2,<10.0.0)",
    "pytest-cov (>=7.0.0,<8.0.0)",
    "httpx (>=0.28.1,<0.29.0)"
]
